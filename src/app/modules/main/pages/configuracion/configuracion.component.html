<h5>Parámetros del servicio</h5>
<p class="text-muted">Cambia el entorno con el select. PRODUCCIÓN está bloqueado hasta habilitarse explícitamente.</p>

<div class="row g-2 align-items-end mb-3">
  <div class="col-auto">
    <label class="form-label">Entorno activo</label>
    <select class="form-select" [(ngModel)]="entornoActivo">
      <option *ngFor="let e of entornos" [value]="e.Entorno">{{ e.Entorno }} — {{ e.Descripcion }}</option>
    </select>
  </div>
  <div class="col-auto">
    <button class="btn btn-warning" (click)="cambiarEntorno()">Cambiar entorno</button>
  </div>
</div>

<form>
  <div class="mb-2 row" *ngFor="let c of config">
    <label class="col-sm-4 col-form-label">{{ c.key }}</label>
    <div class="col-sm-8">
      <input type="text" class="form-control" [(ngModel)]="c.value" [name]="c.key" [disabled]="c.disabled">
    </div>
  </div>
</form>
<button class="btn btn-success mt-3" (click)="saveConfig()">Guardar configuración</button>
